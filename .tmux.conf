##### General settings ########################################################

# Enable mouse selection, scrolling and pane resizing
set -g mouse on

# Allow supported terminals to access the system clipboard
set -s set-clipboard on

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Remove numbering gaps after closing windows
set -g renumber-windows on


##### Status bar ##############################################################

# Show the session name and a PREFIX indicator
set -g status-left-length 40
set -g status-left '#[reverse]#[bold][#S]#[default] #{?client_prefix,#[reverse]#[bold] PREFIX #[default],}'

# Show pane number, hostname and time
set -g status-right-length 80
set -g status-right '#[dim]Pane #P | #H | %Y-%m-%d %H:%M#[default]'


##### Convenient key bindings ################################################

# Reload this configuration with Ctrl+B, then r
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"

# Create new windows in the current pane's directory
bind c new-window -c '#{pane_current_path}'

# Split panes in the current pane's directory
unbind '"'
unbind %
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'

# Resize panes with Ctrl+B, then H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Use Vim-style keys in copy mode
setw -g mode-keys vi

# Copy-mode selection
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel


##### Plugin configuration ####################################################

# Ctrl+Space opens tmux-menus without the tmux prefix
set -g @menus_trigger 'C-Space'
set -g @menus_without_prefix 'Yes'
set -g @menus_show_key_hints 'Yes'


##### Plugins #################################################################

set -g @plugin 'tmux-plugins/tpm'

# Provides general defaults including:
# escape-time, history-limit, display-time, status-interval and focus-events
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'noscript/tmux-mighty-scroll'

# Ctrl+B, then Space opens which-key
set -g @plugin 'alexwforsythe/tmux-which-key'

# Load after which-key so Ctrl+Space belongs to tmux-menus
set -g @plugin 'jaclu/tmux-menus'


##### Initialize TPM ##########################################################

# This must remain at the bottom
run '~/.tmux/plugins/tpm/tpm'
